<!-- ============================================================================
     VISUAL-REPORT NAVIGATION PATTERNS: for a multi-page / tabbed report
     When a report has many sections (per audit, per service, per module), a flat
     row of buttons wraps to a second line and reads clumsy. Use one of the two
     patterns below instead. Each page is a <section class="vr-tabpage" data-tab="ID">
     and the script shows exactly one at a time. Inline only, zero external hosts.

     Pattern A = top two-level nav (primary pills + contextual sub-tabs).
     Pattern B = left sidebar (grouped, with per-page count badges). Better past ~6 pages.
     Pick ONE. Both switch the same .vr-tabpage sections.
     ============================================================================ -->

<!-- ========================= PATTERN A: two-level top nav ===================== -->
<style>
  .vr-nav{position:sticky;top:0;z-index:50;padding:10px 0 0;margin-bottom:18px;
    background:color-mix(in srgb,var(--vr-bg) 92%,transparent);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--vr-border)}
  .vr-nav-primary{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .vr-pill{border:1px solid var(--vr-border);background:var(--vr-surface);color:var(--vr-text);
    font:600 .86rem/1 var(--vr-font);padding:9px 16px;border-radius:999px;cursor:pointer}
  .vr-pill:hover{background:var(--vr-surface-2)}
  .vr-pill.vr-active{background:var(--vr-accent);color:var(--vr-accent-fg);border-color:var(--vr-accent)}
  .vr-nav-secondary{display:flex;gap:2px;margin-top:10px}
  .vr-nav-secondary[hidden]{display:none}
  .vr-subtab{border:none;background:none;color:var(--vr-muted);font:600 .84rem/1 var(--vr-font);
    padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .vr-subtab:hover{color:var(--vr-text)}
  .vr-subtab.vr-active{color:var(--vr-accent);border-bottom-color:var(--vr-accent)}
  .vr-tabpage[hidden]{display:none}
</style>
<nav class="vr-nav">
  <div class="vr-nav-primary">
    <button class="vr-pill vr-active" data-svc="dashboard">Overview</button>
    <button class="vr-pill" data-svc="groupA">Group A</button>
    <button class="vr-pill" data-svc="groupB">Group B</button>
  </div>
  <div class="vr-nav-secondary" hidden>
    <button class="vr-subtab" data-type="one">Section one</button>
    <button class="vr-subtab" data-type="two">Section two</button>
  </div>
</nav>
<!-- page ids follow the scheme "<group>-<type>", e.g. groupA-one. Dashboard id = "dashboard". -->
<script>
(function(){
  var pages=[].slice.call(document.querySelectorAll('.vr-tabpage'));
  var svc=[].slice.call(document.querySelectorAll('.vr-pill'));
  var sub=[].slice.call(document.querySelectorAll('.vr-subtab'));
  var sec=document.querySelector('.vr-nav-secondary');
  var curSvc='dashboard', curType='one';
  function show(id){pages.forEach(function(p){p.hidden=p.getAttribute('data-tab')!==id;});window.scrollTo({top:0,behavior:'auto'});}
  function mp(s){svc.forEach(function(b){b.classList.toggle('vr-active',b.getAttribute('data-svc')===s);});}
  function ms(t){sub.forEach(function(b){b.classList.toggle('vr-active',b.getAttribute('data-type')===t);});}
  function selectService(s){curSvc=s;mp(s);if(s==='dashboard'){sec.hidden=true;show('dashboard');return;}sec.hidden=false;ms(curType);show(s+'-'+curType);}
  function setType(t){curType=t;ms(t);show(curSvc+'-'+t);}
  svc.forEach(function(b){b.addEventListener('click',function(){selectService(b.getAttribute('data-svc'));});});
  sub.forEach(function(b){b.addEventListener('click',function(){setType(b.getAttribute('data-type'));});});
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-goto]');if(a){e.preventDefault();
    var m=a.getAttribute('data-goto').match(/^(.+)-([^-]+)$/);if(m){curType=m[2];selectService(m[1]);}else selectService('dashboard');}});
  selectService('dashboard');
})();
</script>

<!-- ========================= PATTERN B: left sidebar ========================= -->
<!-- Prefer this past ~6 pages: a vertical list never wraps, groups read clearly,
     and a per-page count badge (red when it carries a Critical) shows weight at a
     glance. On narrow screens the sidebar hides and a <select> jump takes over. -->
<style>
  .vr-layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:32px;max-width:1180px;margin:0 auto;padding:24px 24px 96px}
  .vr-side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
  .vr-side-group{margin-top:14px;display:flex;flex-direction:column;gap:1px}
  .vr-side-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--vr-faint);padding:2px 10px 4px}
  .vr-side-item{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;width:100%;
    border:none;background:none;color:var(--vr-text);font:600 .88rem/1.2 var(--vr-font);
    padding:8px 10px;border-radius:8px;cursor:pointer;border-left:2px solid transparent}
  .vr-side-item:hover{background:var(--vr-surface-2)}
  .vr-side-item.vr-active{background:var(--vr-surface-2);border-left-color:var(--vr-accent);color:var(--vr-accent)}
  .vr-side-badge{font-size:.68rem;font-weight:700;color:var(--vr-muted);background:var(--vr-surface);
    border:1px solid var(--vr-border);border-radius:999px;padding:1px 7px;min-width:22px;text-align:center}
  .vr-side-badge[data-crit="1"]{color:var(--vr-crit);border-color:color-mix(in srgb,var(--vr-crit) 45%,var(--vr-border));
    background:color-mix(in srgb,var(--vr-crit) 10%,transparent)}
  .vr-content{min-width:0}
  .vr-jump{display:none}
  @media (max-width:860px){
    .vr-layout{grid-template-columns:1fr;gap:0}
    .vr-side{display:none}
    .vr-jump{display:block;position:sticky;top:0;z-index:50;width:100%;padding:11px 12px;margin-bottom:16px;
      background:var(--vr-surface);color:var(--vr-text);border:1px solid var(--vr-border);border-radius:10px;font:600 .9rem var(--vr-font)}
  }
</style>
<div class="vr-layout">
  <aside class="vr-side">
    <button class="vr-side-item vr-active" data-target="dashboard">Overview</button>
    <div class="vr-side-group"><div class="vr-side-label">Group A</div>
      <button class="vr-side-item" data-target="groupA-one"><span>Section one</span><span class="vr-side-badge" data-crit="1">12</span></button>
      <button class="vr-side-item" data-target="groupA-two"><span>Section two</span><span class="vr-side-badge" data-crit="0">4</span></button>
    </div>
  </aside>
  <div class="vr-content">
    <select class="vr-jump" aria-label="Jump to section">
      <option value="dashboard">Overview</option>
      <optgroup label="Group A">
        <option value="groupA-one">Group A · Section one (12)</option>
        <option value="groupA-two">Group A · Section two (4)</option>
      </optgroup>
    </select>
    <!-- <section class="vr-tabpage" data-tab="dashboard"> ... </section> and one per page here -->
  </div>
</div>
<script>
(function(){
  var pages=[].slice.call(document.querySelectorAll('.vr-tabpage'));
  var items=[].slice.call(document.querySelectorAll('.vr-side-item'));
  var jump=document.querySelector('.vr-jump');
  function show(id){pages.forEach(function(p){p.hidden=p.getAttribute('data-tab')!==id;});
    items.forEach(function(b){b.classList.toggle('vr-active',b.getAttribute('data-target')===id);});
    if(jump)jump.value=id;window.scrollTo({top:0,behavior:'auto'});}
  items.forEach(function(b){b.addEventListener('click',function(){show(b.getAttribute('data-target'));});});
  if(jump)jump.addEventListener('change',function(){show(jump.value);});
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-goto]');if(a){e.preventDefault();show(a.getAttribute('data-goto'));}});
  show('dashboard');
})();
</script>
